name: Post — publish next product to all 3 platforms

on:
  schedule:
    # All times are Riyadh (UTC+3). Cron is in UTC, so subtract 3 hours.
    # 09:00 Riyadh = 06:00 UTC
    - cron: "0 6 * * *"
    # 10:00 Riyadh = 07:00 UTC
    - cron: "0 7 * * *"
    # 12:00 Riyadh = 09:00 UTC
    - cron: "0 9 * * *"
    # 14:00 Riyadh = 11:00 UTC
    - cron: "0 11 * * *"
    # 16:00 Riyadh = 13:00 UTC
    - cron: "0 13 * * *"
    # 17:00 Riyadh = 14:00 UTC
    - cron: "0 14 * * *"
    # 18:00 Riyadh = 15:00 UTC
    - cron: "0 15 * * *"
    # 20:00 Riyadh = 17:00 UTC
    - cron: "0 17 * * *"
    # 21:00 Riyadh = 18:00 UTC
    - cron: "0 18 * * *"
    # 22:00 Riyadh = 19:00 UTC
    - cron: "0 19 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: bot-state
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium + system libs
        run: python -m playwright install --with-deps chromium

      - name: Prepare config.json from example
        run: cp config.example.json config.json

      - name: Write cookies from secrets
        env:
          X_COOKIES_JSON: ${{ secrets.X_COOKIES_JSON }}
          PINTEREST_COOKIES_JSON: ${{ secrets.PINTEREST_COOKIES_JSON }}
        run: |
          printf '%s' "$X_COOKIES_JSON" > x_cookies.json
          printf '%s' "$PINTEREST_COOKIES_JSON" > pinterest_cookies.json

      - name: Post next product
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          PINTEREST_EMAIL: ${{ secrets.PINTEREST_EMAIL }}
          PINTEREST_PASSWORD: ${{ secrets.PINTEREST_PASSWORD }}
        run: python main.py --post

      - name: Upload debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-${{ github.run_id }}
          path: |
            output/debug/
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit updated state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/queue.json state/posted.json || true
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "bot: post $(date -u +%H:%M)"
            git push
          fi
